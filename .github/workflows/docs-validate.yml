name: docs-validate
on:
  pull_request:
    paths:
      - "docs/**"
      - "knowledge/**"
      - "documentation/**"
      - "engine/reality-engine/**"
      - "runtime/**"
      - "sops/**"
      - "agents/**"
      - "bootstrap/**"
      - "playbook/**"

jobs:
  schema-v1:
    runs-on: ubuntu-latest
    env:
      # Brownfield rollout: set "true" during the warn-only period (see playbook/migrate-legacy.md).
      # Greenfield (this repo): leave empty → strict from the first PR.
      WARN_ONLY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Validate Canonical Schema v1 frontmatter (own docs/)
        run: |
          bash documentation/validation/validate-frontmatter.sh
      - name: Validate knowledge/ frontmatter
        run: |
          ROOT=knowledge bash documentation/validation/validate-frontmatter.sh knowledge
      - name: Validate templates (canonical Schema v1 placeholders)
        run: |
          # documentation/templates/ live outside docs/ → CI does not check them automatically.
          # Verify that every template has schema: 1 and the mandatory fields.
          for f in documentation/templates/*.md; do
            fm=$(awk 'NR==1 && $0=="---"{f=1; next} f && $0=="---"{exit} f{print}' "$f")
            [ -n "$fm" ] || { echo "ERROR: $f: no frontmatter"; exit 1; }
            echo "$fm" | grep -qE "^schema:[[:space:]]*1[[:space:]]*$" || { echo "ERROR: $f: schema != 1"; exit 1; }
            for field in id type status date owners; do
              echo "$fm" | grep -qE "^${field}:" || { echo "ERROR: $f: missing mandatory field '$field'"; exit 1; }
            done
          done
          echo "templates: OK"
      - name: Validate Runtime dependency graph
        run: |
          bash documentation/validation/validate-runtime.sh
