name: docs-validate
on:
  pull_request:
    paths:
      - "docs/**"
      - "knowledge/**"
      - "engine/templates/**"
      - "engine/schemas/**"
      - "playbook/**"

jobs:
  schema-v1:
    runs-on: ubuntu-latest
    env:
      # Brownfield rollout: поставить "true" на период warn-only (см. playbook/migrate-legacy.md).
      # Greenfield (этот репо): оставить пустым → strict с первого PR.
      WARN_ONLY: ""
    steps:
      - uses: actions/checkout@v4
      - name: Validate Canonical Schema v1 frontmatter (own docs/)
        run: |
          bash engine/validators/validate-frontmatter.sh
      - name: Validate knowledge/ frontmatter
        run: |
          ROOT=knowledge bash engine/validators/validate-frontmatter.sh knowledge
      - name: Validate templates (canonical Schema v1 placeholders)
        run: |
          # engine/templates/ лежат вне docs/ → CI их не проверяет автоматически.
          # Проверяем, что каждый template имеет schema: 1 и mandatory поля.
          for f in engine/templates/*.md; do
            fm=$(awk 'NR==1 && $0=="---"{f=1; next} f && $0=="---"{exit} f{print}' "$f")
            [ -n "$fm" ] || { echo "ERROR: $f: no frontmatter"; exit 1; }
            echo "$fm" | grep -qE "^schema:[[:space:]]*1[[:space:]]*$" || { echo "ERROR: $f: schema != 1"; exit 1; }
            for field in id type status date owners; do
              echo "$fm" | grep -qE "^${field}:" || { echo "ERROR: $f: missing mandatory field '$field'"; exit 1; }
            done
          done
          echo "templates: OK"
