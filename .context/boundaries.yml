---
# Boundaries — where agents are allowed to write
# Generated by naprolom bootstrap (universal, OS-agnostic)
# All paths are relative to the repository root (forward slashes everywhere).

pristine:
  # Source of truth — never write here directly
  - /
  - /src/
  - /tests/
  - /docs/
  - /.context/

generated:
  # Auto-detected from .gitignore — safe to clean / overwrite
  - /node_modules/
  - /dist/
  - /build/
  - /.next/
  - /coverage/
  - /docs/.runtime/
  - /.claude/

secrets:
  # Must never be committed
  - /.env
  - /.env.*
  - /*.key
  - /*.pem
  - /secrets/
