validation:
  description: What validators check, in machine-readable form
  version: 1

  validators:
    - name: validate-frontmatter
      path: documentation/validation/validate-frontmatter.sh
      description: "Validates Canonical Schema v1 frontmatter in all .md files"
      checks:
        - "schema: 1 present"
        - "mandatory fields: id, type, status, date, owners"
        - "no legacy fields: lifecycle, author, title, created, referenced_by, supersedes_adr, excludes-from-scope"
        - "spec/audit path-status match (status equals parent directory)"
        - "runbook requires kind: field"
        - "spec/audit should have non-empty entity_refs"
      scope: docs/**/*.md, knowledge/**/*.md
      configurable:
        - name: ROOT
          description: "Override docs root directory"
          default: "docs"
        - name: WARN_ONLY
          description: "Warn-only mode for brownfield rollout"
          default: ""

    - name: validate-runtime
      path: documentation/validation/validate-runtime.sh
      description: "Validates Runtime dependency graph integrity"
      checks:
        - "Role → Capability: every capabilities: entry exists in knowledge/capabilities.md"
        - "Capability → Knowledge: every capability references existing knowledge file"
        - "Knowledge exists: every knowledge: short-id resolves to knowledge/<id>.md"
        - "Registry consistency: every component in registry has matching file on disk"
        - "Contract consistency: every contract referenced by registry exists and is valid YAML"
        - "Bootstrap consistency: bootstrap references components that exist in registry"
        - "Workflow consistency: every SOP role: has matching agent, every capability: exists"
        - "Template conformance: every documentation/templates/*.md has valid Schema v1 FM"
        - "Internal links: all entity_refs resolve to existing id: fields"
        - "Engine components: every collector/analyzer/reporter referenced by SOP exists"
      scope: runtime/ (full dependency graph)
      depends_on: registry
