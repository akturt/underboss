migration:
  description: Version transition rules for Runtime upgrades
  version: 1

  transitions:
    - from: "1.0"
      to: "1.1"
      requires_bootstrap: true
      requires_manual_actions: true
      requires_consumer_changes: true
      breaking: true
      changes:
        - description: "Submodule mount point moved"
          from: ".context/runtime/underboss/"
          to: "docs/.runtime/underboss/"
          action: "git mv .context/runtime docs/.runtime && git submodule absorbgitdirs"
        - description: "Bootstrap paths updated"
          from: "bash .context/runtime/underboss/bootstrap/bootstrap.sh"
          to: "bash docs/.runtime/underboss/bootstrap/bootstrap.sh"
        - description: "Knowledge layer added"
          paths: ["knowledge/"]
        - description: "New agents added"
          paths: ["agents/claude-code/reality-auditor.md", "agents/claude-code/adversary-checker.md"]
        - description: "New SOPs added"
          paths: ["sops/architecture-review.yaml", "sops/forensic-audit.yaml"]

    - from: "1.1"
      to: "1.2"
      requires_bootstrap: false
      requires_manual_actions: false
      requires_consumer_changes: false
      breaking: false
      changes:
        - description: "Registry added as primary object"
          paths: ["runtime/registry.yaml"]
        - description: "State machine added"
          paths: ["runtime/state-machine.yaml"]
        - description: "Contracts split into runtime/consumer"
          paths: ["runtime/contracts/"]
        - description: "Reality Engine extracted"
          paths: ["engine/reality-engine/"]
        - description: "Self-validation added"
          paths: ["documentation/validation/validate-runtime.sh"]
        - description: "Entity catalog template added"
          paths: ["bootstrap/templates/entity-catalog.md"]

    - from: "1.2"
      to: "1.2.1"
      requires_bootstrap: false
      requires_manual_actions: false
      requires_consumer_changes: false
      breaking: false
      changes:
        - description: "Subshell bug fix in validate-runtime.sh"
          paths: ["documentation/validation/validate-runtime.sh"]
        - description: "Auto-upgrade v1.1→v1.2 added"
          paths: ["bootstrap/bootstrap.sh"]

    - from: "1.2.1"
      to: "1.3"
      requires_bootstrap: false
      requires_manual_actions: false
      requires_consumer_changes: false
      breaking: false
      changes:
        - description: "Auto-detect stack from lockfiles"
          paths: ["bootstrap/bootstrap.sh"]
        - description: "Auto-generate boundaries.yml from .gitignore"
          paths: ["bootstrap/bootstrap.sh"]
        - description: "Auto-generate architecture/README.md"
          paths: ["bootstrap/bootstrap.sh"]

    - from: "1.3"
      to: "1.4"
      requires_bootstrap: false
      requires_manual_actions: false
      requires_consumer_changes: false
      breaking: false
      changes:
        - description: "Module decomposition: Runtime Core + Documentation Module"
          paths: ["documentation/"]
          details: "engine/templates/, engine/validators/, engine/schemas/ moved to documentation/"
        - description: "Registry updated with composition: section"
          paths: ["runtime/registry.yaml"]
        - description: "State machine simplified: removed transient 'updated' state"
          paths: ["runtime/state-machine.yaml"]
        - description: "Project layout flipped to positive (allowed_root)"
          paths: ["runtime/contracts/consumer/project-layout.yaml"]
        - description: "Migration transitions now include requires_* flags"
          paths: ["runtime/contracts/runtime/migration.yaml"]

    - from: "1.4"
      to: "1.5"
      requires_bootstrap: false
      requires_manual_actions: false
      requires_consumer_changes: false
      breaking: false
      changes:
        - description: "Bootstrap decomposed: orchestrator + lib modules + generators + detectors"
          paths: ["bootstrap/lib/", "bootstrap/generators/", "bootstrap/detectors/", "bootstrap/bootstrap.sh"]
        - description: "Registry expanded with schema, contracts, directories, templates, validators, generators, scripts, detectors, components sections"
          paths: ["runtime/registry.yaml"]
        - description: "Stack detectors as plugins (node, python, go, rust, php, docker)"
          paths: ["bootstrap/detectors/"]
        - description: "validate-runtime.sh updated for new registry structure"
          paths: ["documentation/validation/validate-runtime.sh"]

    - from: "1.5"
      to: "1.6"
      requires_bootstrap: false
      requires_manual_actions: false
      requires_consumer_changes: false
      breaking: false
      changes:
        - description: "Runtime API extracted: runtime/lib/yaml.sh, registry.sh, state.sh, detectors.sh, generators.sh, components.sh"
          paths: ["runtime/lib/"]
        - description: "Internal YAML parser replaces awk/grep/sed for registry parsing"
          paths: ["runtime/lib/yaml.sh"]
        - description: "Bootstrap reads directories from registry (no hardcoded mkdir)"
          paths: ["bootstrap/bootstrap.sh"]
        - description: "install.sh reads entrypoints from registry"
          paths: ["bootstrap/install.sh"]
        - description: "Generator API standardized: generate TARGET REGISTRY"
          paths: ["bootstrap/generators/"]
        - description: "Detector API standardized: detect() outputs backend|database|infrastructure"
          paths: ["bootstrap/detectors/"]
        - description: "Generators registered in registry with entry: field"
          paths: ["runtime/registry.yaml"]
        - description: "validate-runtime.sh uses Runtime API for all registry parsing"
          paths: ["documentation/validation/validate-runtime.sh"]

  breaking_changes:
    - version: "1.0 → 1.1"
      description: "Submodule path changed. Consumers on v1.0 must migrate."
      migration_guide: "git mv .context/runtime docs/.runtime && git submodule absorbgitdirs"
