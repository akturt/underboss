migration:
  description: Version transition rules for Runtime upgrades
  version: 1

  transitions:
    - from: "1.0"
      to: "1.1"
      changes:
        - description: "Submodule mount point moved"
          from: ".context/runtime/naprolom-docs/"
          to: "docs/.runtime/naprolom-docs/"
          action: "git mv .context/runtime docs/.runtime && git submodule absorbgitdirs"
        - description: "Bootstrap paths updated"
          from: "bash .context/runtime/naprolom-docs/bootstrap/bootstrap.sh"
          to: "bash docs/.runtime/naprolom-docs/bootstrap/bootstrap.sh"
        - description: "Knowledge layer added"
          paths: ["knowledge/"]
        - description: "New agents added"
          paths: ["agents/claude-code/reality-auditor.md", "agents/claude-code/adversary-checker.md"]
        - description: "New SOPs added"
          paths: ["sops/architecture-review.yaml", "sops/forensic-audit.yaml"]

    - from: "1.1"
      to: "1.2"
      changes:
        - description: "Registry added as primary object"
          paths: ["runtime/registry.yaml"]
        - description: "State machine added"
          paths: ["runtime/state-machine.yaml"]
        - description: "Contracts split into runtime/consumer"
          paths: ["runtime/contracts/"]
        - description: "Reality Engine extracted"
          paths: ["engine/reality-engine/"]
        - description: "Self-validation added"
          paths: ["engine/validators/validate-runtime.sh"]
        - description: "Entity catalog template added"
          paths: ["bootstrap/templates/entity-catalog.md"]

  breaking_changes:
    - version: "1.0 → 1.1"
      description: "Submodule path changed. Consumers on v1.0 must migrate."
      migration_guide: "git mv .context/runtime docs/.runtime && git submodule absorbgitdirs"
