runtime:
  version: "1.8"

bootstrap:
  engine_version: "2.0"

schema:
  version: 1

contracts:
  version: 1

registry:
  version: 1

compatibility:
  schema:
    - 1
  consumer:
    - "1.1"
    - "1.2"
  bootstrap:
    - 2

composition:
  core:
    description: "Infrastructure layer: registry, state machine, contracts, bootstrap engine, reality engine"
    directories:
      - runtime/
      - bootstrap/
      - engine/reality-engine/

  documentation:
    description: "Documentation layer: templates, validation, knowledge, agents, SOPs, playbook"
    directories:
      - documentation/
      - knowledge/
      - agents/
      - sops/
      - playbook/

entrypoints:
  bootstrap: bootstrap/bootstrap.sh
  installer: bootstrap/install.sh
  validator: documentation/validation/validate-runtime.sh

directories:
  docs:
    - path: architecture/
      description: "topology, invariants, domain model"
      required: false
    - path: adr/
      description: "Architecture Decision Records"
      required: false
    - path: specs/drafts/
      description: "specifications in draft"
      required: false
    - path: specs/review/
      description: "specifications under review"
      required: false
    - path: specs/approved/
      description: "approved specifications"
      required: false
    - path: specs/implemented/
      description: "implemented specifications"
      required: false
    - path: specs/superseded/
      description: "superseded specifications"
      required: false
    - path: audits/
      description: "audit reports and reality checks"
      required: false
    - path: backlog/
      description: "backlog items"
      required: false
    - path: api/
      description: "API documentation"
      required: false

  context:
    - path: project.yml
      description: "project metadata (stack, domain, maintainer)"
      required: true
    - path: boundaries.yml
      description: "boundary definitions (pristine, editable, generated, secret)"
      required: true
    - path: agent-entry.md
      description: "agent entry protocol"
      required: true

templates:
  - name: architecture
    type: architecture
    path: documentation/templates/architecture.md
  - name: adr
    type: adr
    path: documentation/templates/adr.md
  - name: spec
    type: spec
    path: documentation/templates/spec.md
  - name: audit
    type: audit
    path: documentation/templates/audit.md
  - name: runbook
    type: runbook
    path: documentation/templates/runbook.md
  - name: backlog
    type: backlog
    path: documentation/templates/backlog.md

validators:
  - name: validate-frontmatter
    path: documentation/validation/validate-frontmatter.sh
  - name: validate-runtime
    path: documentation/validation/validate-runtime.sh

generators:
  - name: architecture-readme
    path: bootstrap/generators/architecture-readme.sh
    entry: generate
    description: "Auto-generate docs/architecture/README.md from project structure"
  - name: boundaries
    path: bootstrap/generators/boundaries.sh
    entry: generate
    description: "Auto-generate .context/boundaries.yml from .gitignore"
  - name: project-yml
    path: bootstrap/generators/project-yml.sh
    entry: generate
    description: "Auto-generate .context/project.yml from lockfiles"
  - name: claude-md
    path: bootstrap/generators/claude-md.sh
    entry: generate
    description: "Generate CLAUDE.md snippet"
  - name: ci-workflow
    path: bootstrap/generators/ci-workflow.sh
    entry: generate
    description: "Generate .github/workflows/docs-validate.yml"
  - name: invariants
    path: bootstrap/generators/invariants.sh
    entry: generate
    description: "Auto-generate docs/architecture/invariants.md from template"

scripts:
  - name: migrate-legacy
    path: engine/scripts/migrate-legacy.mjs
    description: "Brownfield migration script (Node.js, zero deps)"

detectors:
  - name: node
    path: bootstrap/detectors/node.sh
    lockfile: package.json
  - name: python
    path: bootstrap/detectors/python.sh
    lockfile: pyproject.toml
  - name: go
    path: bootstrap/detectors/go.sh
    lockfile: go.mod
  - name: rust
    path: bootstrap/detectors/rust.sh
    lockfile: Cargo.toml
  - name: php
    path: bootstrap/detectors/php.sh
    lockfile: composer.json
  - name: docker
    path: bootstrap/detectors/docker.sh
    lockfile: docker-compose.yml

components:
  agents:
    - name: architecture-reviewer
    - name: documentation-reviewer
    - name: reality-auditor
    - name: adversary-checker

  knowledge:
    - architecture-principles
    - evidence-model
    - audit-principles
    - report-formats
    - capabilities

  sops:
    - architecture-review
    - forensic-audit
    - reality-audit
    - new-feature
    - bugfix
    - new-service
    - architecture-change
    - audit
    - release
    - incident

  contracts:
    runtime:
      - installation
      - migration
      - validation
    consumer:
      - boundaries
      - project-layout

  engine:
    collectors:
      - architecture-inventory
      - entity-inventory
      - module-inventory
      - dependency-graph
    analyzers:
      - documentation-drift
      - adr-drift
      - spec-drift
    reporters:
      - reality-report
