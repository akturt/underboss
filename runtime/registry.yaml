runtime:
  version: "1.4"

schema:
  version: 1

contracts:
  version: 1

registry:
  version: 1

compatibility:
  schema:
    - 1
  consumer:
    - "1.1"
    - "1.2"
  bootstrap:
    - 2

composition:
  core:
    description: "Infrastructure layer: registry, state machine, contracts, bootstrap, reality engine"
    directories:
      - runtime/
      - bootstrap/
      - engine/reality-engine/

  documentation:
    description: "Documentation layer: templates, validation, knowledge, agents, SOPs, playbook"
    directories:
      - documentation/
      - knowledge/
      - agents/
      - sops/
      - playbook/

entrypoints:
  bootstrap: bootstrap/bootstrap.sh
  bootstrap_ps: bootstrap/bootstrap.ps1
  installer: bootstrap/install.sh
  validator: documentation/validation/validate-runtime.sh

components:
  agents:
    - name: architecture-reviewer
    - name: documentation-reviewer
    - name: reality-auditor
    - name: adversary-checker

  knowledge:
    - architecture-principles
    - evidence-model
    - audit-principles
    - report-formats
    - capabilities

  sops:
    - architecture-review
    - forensic-audit
    - reality-audit
    - new-feature
    - bugfix
    - new-service
    - architecture-change
    - audit
    - release
    - incident

  contracts:
    runtime:
      - installation
      - migration
      - validation
    consumer:
      - boundaries
      - project-layout

  validators:
    - validate-frontmatter
    - validate-runtime

  engine:
    collectors:
      - architecture-inventory
      - entity-inventory
      - module-inventory
      - dependency-graph
    analyzers:
      - documentation-drift
      - adr-drift
      - spec-drift
    reporters:
      - reality-report

  templates:
    - architecture
    - adr
    - spec
    - audit
    - runbook
    - backlog
