name: release
description: Release of a new version — from prep to verify and optional post-release audit
triggers:
  - milestone complete (N tasks from backlog closed)
  - release branch created
  - security patch required

input:
  required:
    - type: spec
      path_pattern: docs/specs/approved/YYYY-MM-DD-release-<version>.md
      status: approved
      frontmatter_mandatory: [version]
  optional:
    - type: audit
      path_pattern: docs/audits/YYYY-MM-DD-pre-release-<version>.md
      status: completed

output:
  - type: git_tag
    name: v<version>
  - type: spec
    final_path: docs/specs/implemented/YYYY-MM-DD-release-<version>.md
    status: implemented
  - type: audit
    final_path: docs/audits/YYYY-MM-DD-release-<version>.md
    status: completed
    condition: only_for_major_or_security

steps:
  - id: 1
    name: Architecture Review — pre-release readiness
    role: architecture-reviewer
    platform: any
    produces: "verify all approved ADRs are included; critical invariants confirmed; no pending architectural decisions"
    depends_on: []

  - id: 2
    name: Documentation Review — pre-release docs sanity
    role: documentation-reviewer
    platform: any
    produces: "all .md in docs/ valid per Schema v1; runbooks up-to-date; secrets doc up-to-date"
    depends_on: []

  - id: 3
    name: Tests green (full suite)
    role: human
    produces: "unit + integration + e2e tests green locally and in CI"
    depends_on: [1, 2]

  - id: 4
    name: Update changelog + version
    role: human
    produces: "CHANGELOG.md (or equivalent) updated; version bump performed per semver"
    depends_on: [3]

  - id: 5
    name: Tag release
    role: human
    produces: "git tag v<version>; tag annotated; release notes attached"
    depends_on: [4]

  - id: 6
    name: Deploy (staging → prod)
    role: human
    produces: "artifact published; deploy to prod performed per runbook"
    depends_on: [5]

  - id: 7
    name: Verify — smoke tests prod
    role: human
    produces: "prod smoke-tests green; key endpoints respond; metrics within normal range"
    depends_on: [6]

  - id: 8
    name: Promote spec approved→implemented
    role: human
    produces: "git mv → docs/specs/implemented/; frontmatter status=implemented; ## Result filled"
    depends_on: [7]

  - id: 9
    name: Post-release audit (для major или security релизов)
    role: human
    platform: any
    produces: "docs/audits/YYYY-MM-DD-release-<version>.md (status=completed): what went well/badly, lessons learned"
    depends_on: [8]
    condition: "if major OR security release"