name: release
description: Релиз новой версии — от prep до verify и опционального post-release audit
triggers:
  - milestone complete (N задач из backlog закрыты)
  - release branch created
  - security patch required

input:
  required:
    - type: spec
      path_pattern: docs/specs/approved/YYYY-MM-DD-release-<version>.md
      status: approved
      frontmatter_mandatory: [version]
  optional:
    - type: audit
      path_pattern: docs/audits/YYYY-MM-DD-pre-release-<version>.md
      status: completed

output:
  - type: git_tag
    name: v<version>
  - type: spec
    final_path: docs/specs/implemented/YYYY-MM-DD-release-<version>.md
    status: implemented
  - type: audit
    final_path: docs/audits/YYYY-MM-DD-release-<version>.md
    status: completed
    condition: only_for_major_or_security

steps:
  - id: 1
    name: Architecture Review — pre-release readiness
    role: architecture-reviewer
    platform: any
    produces: "проверка что все approved ADR включены; критические инварианты подтверждены; нет pending architectural decisions"
    depends_on: []

  - id: 2
    name: Documentation Review — pre-release docs sanity
    role: documentation-reviewer
    platform: any
    produces: "все .md в docs/ валидные по Schema v1; runbooks актуальны; secrets doc up-to-date"
    depends_on: []

  - id: 3
    name: Tests green (full suite)
    role: human
    produces: "unit + integration + e2e tests зелёные локально и в CI"
    depends_on: [1, 2]

  - id: 4
    name: Update changelog + version
    role: human
    produces: "CHANGELOG.md (или эквивалент) обновлён; version bump выполнен согласно semver"
    depends_on: [3]

  - id: 5
    name: Tag release
    role: human
    produces: "git tag v<version>; tag annotated; release notes приложены"
    depends_on: [4]

  - id: 6
    name: Deploy (staging → prod)
    role: human
    produces: "artifact опубликован; deploy в prod выполнен по runbook"
    depends_on: [5]

  - id: 7
    name: Verify — smoke tests prod
    role: human
    produces: "prod smoke-tests зелёные; key endpoints отвечают; метрики в норме"
    depends_on: [6]

  - id: 8
    name: Promote spec approved→implemented
    role: human
    produces: "git mv → docs/specs/implemented/; frontmatter status=implemented; заполнен ## Result"
    depends_on: [7]

  - id: 9
    name: Post-release audit (для major или security релизов)
    role: human
    platform: any
    produces: "docs/audits/YYYY-MM-DD-release-<version>.md (status=completed): что прошло хорошо/плохо, уроки"
    depends_on: [8]
    condition: "if major OR security release"