name: new-service
description: Adding a new service/microservice to the infrastructure — from proposal to deploy + audit
triggers:
  - Spec created with type «new service»
  - PR adds a new entry to docker-compose.yml / kubernetes manifest

input:
  required:
    - type: spec
      path_pattern: docs/specs/drafts/YYYY-MM-DD-<service-name>-service.md
      status: draft
      frontmatter_mandatory: [entity_refs, touches]

output:
  - type: adr
    final_path: docs/adr/NNN-<service-name>.md
    status: accepted
  - type: spec
    final_path: docs/specs/implemented/YYYY-MM-DD-<service-name>-service.md
    status: implemented
  - type: architecture_doc
    path: docs/architecture/<topic>.md
    status: active
  - type: runbook
    final_path: docs/<service-name>-deploy.md
    status: active
    kind: deploy
  - type: audit
    final_path: docs/audits/YYYY-MM-DD-<service-name>-service.md
    status: completed

steps:
  - id: 1
    name: Architecture Review
    role: architecture-reviewer
    platform: any
    produces: "ADR proposed; invariants from docs/architecture/README.md checked against the new service"
    depends_on: []

  - id: 2
    name: Documentation Review — spec frontmatter
    role: documentation-reviewer
    platform: any
    produces: "spec with valid Schema v1 FM"
    depends_on: []

  - id: 3
    name: Promote spec drafts→review
    role: human
    produces: "git mv → docs/specs/review/; frontmatter status=review"
    depends_on: [1, 2]

  - id: 4
    name: Promote spec review→approved
    role: human
    produces: "git mv → docs/specs/approved/; frontmatter status=approved"
    depends_on: [3]

  - id: 5
    name: Update architecture docs — topology, data model, invariants
    role: human
    produces: "docs/architecture/README.md Module Index updated; docs/architecture/topology.md updated (ports, networks)"
    depends_on: [4]

  - id: 6
    name: Create service deploy runbook
    role: human
    produces: "docs/<service-name>-deploy.md (type: runbook, kind: deploy)"
    depends_on: [4]

  - id: 7
    name: Add secrets references
    role: human
    produces: "docs/secrets.md updated (or a new docs/<service-name>-secrets.md if there are many secrets)"
    depends_on: [4]

  - id: 8
    name: Update ops runbook
    role: human
    produces: "docs/ops.md day-to-day operations includes the new service"
    depends_on: [4]

  - id: 9
    name: Implementation (docker-compose / k8s / Terraform / service code)
    role: human
    produces: "PR with infrastructure and service code, tests green"
    depends_on: [5, 6, 7, 8]

  - id: 10
    name: Deploy (staging → prod)
    role: human
    produces: "service brought up in staging, smoke-tests green, release to prod"
    depends_on: [9]

  - id: 11
    name: Documentation Review — post-implementation
    role: documentation-reviewer
    platform: any
    produces: "all affected .md in docs/ have valid Schema v1 FM"
    depends_on: [10]

  - id: 12
    name: Promote spec approved→implemented + fill ## Result
    role: human
    produces: "git mv → docs/specs/implemented/; frontmatter status=implemented"
    depends_on: [10]

  - id: 13
    name: Audit — post-deploy review
    role: human
    platform: any
    produces: "docs/audits/YYYY-MM-DD-<service-name>-service.md (status=completed)"
    depends_on: [12]