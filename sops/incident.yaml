name: incident
description: Production incident — от detect до postmortem и incident audit
triggers:
  - alert fired (PagerDuty / Slack alert)
  - manual escalation от operator
  - customer-visible degradation

input:
  required:
    - type: trigger
      description: "alert source, severity, начальные симптомы"
    - type: scope
      description: "пострадавшие сущности (services, data, users)"

output:
  - type: audit
    final_path: docs/audits/YYYY-MM-DD-incident-<slug>.md
    status: completed
    body_sections: [Summary, Findings (root cause), Resolution, Delta]
  - type: adr
    final_path: docs/adr/NNN-incident-<slug>-followup.md
    status: proposed
    condition: if_architectural_fix_needed
  - type: runbook_update
    note: "если postmortem показал gaps в существующих runbooks"

steps:
  - id: 1
    name: Detect + acknowledge
    role: human
    produces: "alert ack; severity assigned (P0|P1|P2); on-call инженер идентифицирован"
    depends_on: []

  - id: 2
    name: Triage — scope, severity, stakeholders
    role: human
    produces: "scope записан: affected services/users; severity confirmed; stakeholders notified"
    depends_on: [1]

  - id: 3
    name: Mitigate — restore service
    role: human
    produces: "service restored (rollback, hotfix, rate-limit, feature flag off) — главное — stop bleeding"
    depends_on: [2]

  - id: 4
    name: Communicate
    role: human
    produces: "stakeholders updated; incident status page updated (если public); internal log updates every 30 min during active"
    depends_on: [3]

  - id: 5
    name: Root cause analysis (post-mitigation)
    role: human
    produces: "RCA записан: что произошло, почему, какие 5 whys привели к root cause"
    depends_on: [3]

  - id: 6
    name: Architecture Review (если root cause архитектурный)
    role: architecture-reviewer
    platform: any
    produces: "если root cause в архитектуре — ADR proposed для структурного фикса"
    depends_on: [5]
    condition: "if architectural root cause"

  - id: 7
    name: Documentation Review — update affected runbooks
    role: documentation-reviewer
    platform: any
    produces: "affected runbooks (docs/troubleshooting.md, docs/<service>-deploy.md) обновлены; missing runbook created if gap found"
    depends_on: [5]

  - id: 8
    name: Write incident audit doc
    role: human
    produces: "cp .context/runtime/naprolom-docs/engine/templates/audit.md → docs/audits/YYYY-MM-DD-incident-<slug>.md; fill frontmatter (status=draft, scope=incident, trigger=<alert source>, entity_refs=affected services)"
    depends_on: [5, 6, 7]

  - id: 9
    name: Fill audit body — Summary, Findings (RCA), Resolution (mitigation + followup plan), Delta (что изменилось по сравнению с прошлым инцидентом)
    role: human
    produces: "audit body заполнен по canonical structure"
    depends_on: [8]

  - id: 10
    name: Promote audit draft→completed + freeze body
    role: human
    produces: "frontmatter status=completed; body append-only; follow-up actions вынесены в Issues или specs/drafts/"
    depends_on: [9]

  - id: 11
    name: Follow-up tracking — open GitHub Issues для каждого follow-up action
    role: human
    produces: "Issues созданы и привязаны к audit doc через entity_refs; tracking labels (incident-followup) проставлены"
    depends_on: [10]