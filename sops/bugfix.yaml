name: bugfix
description: Исправление бага — от репродукции до закрытия баг-репорта с минимальной бюрократией
triggers:
  - Открыт GitHub Issue с label bug
  - PR помечен как hotfix

input:
  required:
    - type: github_issue
      label: bug
  optional:
    - type: spec
      path_pattern: docs/specs/drafts/YYYY-MM-DD-bugfix-<slug>.md
      status: draft
      note: "spec создаётся только если фикс — не тривиальный (затрагивает контракт, модель данных, security); otherwise commit message + PR description достаточно"

output:
  - type: pr
    state: merged
  - type: audit
    final_path: docs/audits/YYYY-MM-DD-bugfix-<slug>.md
    status: completed
    condition: only_for_hotfix_or_security
  - type: github_issue
    state: closed

steps:
  - id: 1
    name: Reproduce
    role: human
    produces: "локально воспроизведённый баг или обоснование «not reproducible»"
    depends_on: []

  - id: 2
    name: Triage — нужна ли spec?
    role: human
    produces: "решение тривиальный-фикс vs не-тривиальный. Для нетривиального — создать spec в docs/specs/drafts/"
    depends_on: [1]

  - id: 3
    name: Documentation Review (если spec создана)
    role: documentation-reviewer
    platform: any
    produces: "spec с корректным Schema v1 FM"
    depends_on: [2]
    condition: "if spec created"

  - id: 4
    name: Fix code
    role: human
    produces: "PR с фиксом и тестами"
    depends_on: [2]

  - id: 5
    name: Tests green
    role: human
    produces: "локально и CI тесты зелёные"
    depends_on: [4]

  - id: 6
    name: Architecture Review (если фикс архитектурно-чувствительный)
    role: architecture-reviewer
    platform: any
    produces: "ACK или ADR если фикс меняет топологию/модель/контракт"
    depends_on: [4]
    condition: "if architectural impact"

  - id: 7
    name: Documentation update (если затронуты docs)
    role: human
    produces: "docs/architecture/, runbook, secrets обновлены по необходимости"
    depends_on: [5]

  - id: 8
    name: Audit (только для hotfix/security)
    role: human
    platform: any
    produces: "docs/audits/YYYY-MM-DD-bugfix-<slug>.md если фикс—hotfix или security"
    depends_on: [5, 7]
    condition: "if hotfix OR security"

  - id: 9
    name: Merge + close issue
    role: human
    produces: "PR merged, Issue closed"
    depends_on: [5, 6, 8]